name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taskmaster
          POSTGRES_PASSWORD: taskmaster
          POSTGRES_DB: taskmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmaster -d taskmaster_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://taskmaster:taskmaster@localhost:5432/taskmaster_test
      DIRECT_DATABASE_URL: postgresql://taskmaster:taskmaster@localhost:5432/taskmaster_test
      CURSOR_SECRET: ci-only-cursor-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start MinIO and create test bucket
        run: |
          docker run --detach --name taskmaster-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minio \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:9000/minio/health/live
          docker exec taskmaster-minio mc alias set local http://127.0.0.1:9000 minio minioadmin
          docker exec taskmaster-minio mc mb --ignore-existing local/taskmaster
      - name: Generate ephemeral test JWT keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          echo "JWT_PRIVATE_KEY_BASE64=$(base64 -w0 /tmp/private.pem)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$(base64 -w0 /tmp/public.pem)" >> "$GITHUB_ENV"
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run openapi:check
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev
