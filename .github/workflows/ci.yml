name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taskmaster
          POSTGRES_PASSWORD: taskmaster
          POSTGRES_DB: taskmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmaster -d taskmaster_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      minio:
        image: minio/minio:RELEASE.2025-07-23T15-54-02Z
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: --health-cmd "mc ready local" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://taskmaster:taskmaster@localhost:5432/taskmaster_test
      DIRECT_DATABASE_URL: postgresql://taskmaster:taskmaster@localhost:5432/taskmaster_test
      CURSOR_SECRET: ci-only-cursor-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate ephemeral test JWT keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          echo "JWT_PRIVATE_KEY_BASE64=$(base64 -w0 /tmp/private.pem)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$(base64 -w0 /tmp/public.pem)" >> "$GITHUB_ENV"
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run openapi:check
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev
