services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD: taskmaster
      POSTGRES_DB: taskmaster
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskmaster -d taskmaster']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres18_data:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 minio minioadmin &&
      mc mb --ignore-existing local/taskmaster"

  redis:
    image: redis:8.2-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ['mail']
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres18_data:
  minio_data:
  redis_data:
